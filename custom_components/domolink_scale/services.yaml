add_profile:
  name: Ajouter un profil
  description: Ajoute un profil utilisateur/enfant/animal dans Domolink-Scale.
  fields:
    name:
      name: Nom
      description: Nom complet ou prénom
      required: true
      example: "Jean-Frédéric"
      selector:
        text:
    category:
      name: Catégorie
      description: Type de profil
      required: false
      default: "adult"
      selector:
        select:
          options:
            - label: Adulte
              value: adult
            - label: Enfant
              value: child
            - label: Chat
              value: cat
            - label: Chien
              value: dog
    gender:
      name: Sexe
      description: "male ou female"
      required: false
      default: "male"
      selector:
        select:
          options:
            - label: Homme
              value: male
            - label: Femme
              value: female
    birthdate:
      name: Date de naissance
      description: Format AAAA-MM-JJ
      required: false
      example: "1980-05-15"
      selector:
        date:
    height:
      name: Taille
      description: En centimètres (cm)
      required: false
      example: 180
      selector:
        number:
          min: 30
          max: 230
          unit_of_measurement: cm
    reference_weight:
      name: Poids actuel / référence
      description: En kg
      required: true
      example: 92.35
      selector:
        number:
          min: 2
          max: 250
          step: 0.1
          unit_of_measurement: kg
    target_weight:
      name: Poids cible
      description: Objectif de poids en kg
      required: false
      example: 85.0
      selector:
        number:
          min: 2
          max: 250
          step: 0.1
          unit_of_measurement: kg
    tolerance:
      name: Tolérance de détection
      description: Marge en +/- kg pour attribuer la pesée à cet utilisateur (défaut 5.0 kg)
      required: false
      default: 5.0
      selector:
        number:
          min: 1.0
          max: 15.0
          step: 0.5
          unit_of_measurement: kg
    color:
      name: Couleur de courbe
      description: Code couleur hexadécimal
      required: false
      default: "#0284c7"
      selector:
        text:

update_profile:
  name: Modifier un profil
  description: Met à jour les paramètres d'un profil existant.
  fields:
    id:
      name: Identifiant du profil
      required: true
      selector:
        text:
    name:
      name: Nom
      selector:
        text:
    category:
      name: Catégorie
      selector:
        select:
          options:
            - label: Adulte
              value: adult
            - label: Enfant
              value: child
            - label: Chat
              value: cat
            - label: Chien
              value: dog
    target_weight:
      name: Poids cible
      selector:
        number:
          min: 2
          max: 250
          step: 0.1
    color:
      name: Couleur
      selector:
        text:

merge_profiles:
  name: Fusionner deux profils
  description: Transfère tout l'historique du profil source vers le profil cible et supprime la source.
  fields:
    source_id:
      name: Identifiant du profil à fusionner (source)
      required: true
      selector:
        text:
    target_id:
      name: Identifiant du profil de destination (cible)
      required: true
      selector:
        text:

delete_profile:
  name: Supprimer un profil
  description: Supprime un profil utilisateur.
  fields:
    id:
      name: Identifiant du profil
      required: true
      selector:
        text:

add_weigh_in:
  name: Ajouter une pesée
  description: Enregistre manuellement une pesée.
  fields:
    weight:
      name: Poids (kg)
      required: true
      selector:
        number:
          min: 2
          max: 250
          step: 0.1
    user_id:
      name: Profil utilisateur (optionnel)
      selector:
        text:
    impedance:
      name: Impédance (ohms)
      selector:
        number:
          min: 50
          max: 1500

reassign_weigh_in:
  name: Réassigner une pesée
  description: Change l'utilisateur associé à une pesée historique.
  fields:
    id:
      name: Identifiant de la pesée
      required: true
      selector:
        text:
    user_id:
      name: Identifiant du nouvel utilisateur
      required: true
      selector:
        text:
